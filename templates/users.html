{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-1">
    <h1><i class="bi bi-person-circle me-2"></i>ユーザ一覧</h1>
    
    <form action="/search_user" method="GET" class="mb-3">
        <div class="input-group mt-2">
            <input type="text" class="form-control w-auto" style="min-width:340px;" placeholder="ユーザーidか姓、名で検索..." name="q">
            <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search me-2"></i>検索</button>
        </div>
    </form>
</div>

<table class="table table-striped table-hover">
    <thead>
        <tr class="border-bottom border-dark">
            <th class="border-end border-#ccc">ユーザid</th>
            <th class="border-end border-#ccc">氏名</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users: %}
        <tr>
            <td class="border-end border-light">{{ user.id }}</td>
            <td class="border-end border-light">{{ user.lastname }} {{ user.firstname}}</td>
            {% if current_user in user.followers %}
            <td>
                <a href="/unfollow/{{ user.id }}"><i class="bi bi-person-fill-dash"></i>フォロー解除</a>
            </td>
            {% else: %}
            <td>
                <a href="/follow/{{ user.id }}"><i class="bi bi-person-fill-add"></i>フォローする</a>
            </td>
            {% endif %}
        </tr>
        {% else: %}
        <tr>
            <td colspan="3">表示する情報がありません</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock content %}
