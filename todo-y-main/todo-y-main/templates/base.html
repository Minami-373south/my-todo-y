<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
    
    body {
        background-image: url('https://illust-stock.com/wp-content/uploads/haikei-aozora.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }
    .alert p {
    margin-bottom: 0;
    }

    .my-navbar {background-color: navy; 
    }
    .my-navbar {
        border-bottom-left-radius: 0.375rem!important;
    border-bottom-right-radius: 0.375rem!important;
    }
    .my-navbar .nav-link,
    .my-navbar .nav-item{
        color: white !important;
        font-weight: 900 !important;
    }
    </style>

    <title>{{ title }}</title>
</head>
<body>
    {% if current_user.is_authenticated: %}
    <header class="sticky-top mb-2">
        <nav class="navbar my-navbar" data-bs-theme="dark">
            <div class="container-fluid">
                <a href="/" class="nav-link"><i class="bi bi-clipboard2 me-2"></i>タスク一覧</a>
                <a href="/users" class="nav-link"><i class="bi bi-person-circle me-2"></i>ユーザ一覧</a>
                <div class="nav-item">
                    {{ current_user.id }} さん
                    <a href="/logout"><span class="btn btn-primary btn-sm"><i class="bi bi-box-arrow-left me-2"></i>ログアウト</span></a>
                </div>
            </div>
        </nav>
    </header>
    {% endif %}
    <aside>
        <div class="container-fluid">
            {% for message in get_flashed_messages(): %}
            <div class="alert alert-warning alert-dismissible fade show">
                <p>{{ message }}</p>
                <span class="btn-close" data-bs-dismiss="alert" aria-label="閉じる"></span>
            </div>
            {% endfor %}
        </div>
    </aside>
    <main>
        <div class="container-fluid">
            {% block content %}
            {% endblock content %}
        </div>
    </main>
</body>
</html>
