{% extends "base.html" %}

{% block content %}
<div class="container-fluid vh-100 p-0">
    <div class="row w-100 h-100 pt-5 pt-md-0 mx-0">

        <!-- 左側 -->
        <div class="col-md-5 bg-info text-white p-0 position-relative d-none d-md-block h-100">
            <a href="https://chibatech.jp/" title="Homepage">
                <img src="https://chibatech.jp/about/institute/disclosure/dl53f3000000156k-img/school_logo.png"
                    alt="CIT"
                    style="position: absolute; top: 10px; left: 10px; width: 25px; height: auto;">
            </a>

            <div class="d-flex flex-column justify-content-between h-100">
                <div class="d-flex justify-content-center align-items-center text-center" style="flex: 1;">
                    <div class="px-4">
                        <h1 class="mb-3">Welcome!!</h1>
                        <p>チームYのWEBアプリです。</p>
                        <p>このアプリでは、タスクを管理し、ユーザー同士で共有できます。</p>
                        <p>ログインして、あなたのタスクを確認しましょう。</p>
                    </div>
                </div>

                <div class="text-center mb-3">
                    <p class="small">©CIT_CIS_Team_Y</p>
                </div>
            </div>
        </div>

        <!-- 右側 -->
        <div class="col-12 col-md-7 d-flex justify-content-center align-items-center h-100">
            <form action="/login" method="post"
                class="p-4 bg-light rounded shadow"
                style="width: 100%; max-width: 500px;">

                <h1 class="text-center mb-4"><i class="bi bi-person-circle me-2"></i>{{ title }}</h1>

                <div class="text-center mb-4">
                    <img src="https://admission.chibatech.ac.jp/media/chibany-img-001.webp"
                        alt="Chibany"
                        style="max-width: 200px; height: auto;">
                </div>

                <div class="form-floating mb-3">
                    <input class="form-control" type="text" name="id" id="id"
                        placeholder="ユーザidを入力..." required>
                    <label for="id">ユーザid</label>
                </div>

                <div class="form-floating mb-3 position-relative">
                    <input class="form-control" type="password" name="password" id="password"
                        placeholder="パスワードを入力" maxlength="20" required>
                    <label for="password">パスワード</label>
                    <button type="button" id="togglePassword" class="btn btn-sm position-absolute"
                            style="top: 50%; right: 10px; transform: translateY(-50%); border: none; background: none;">
                        <i class="bi bi-eye-slash-fill text-muted"></i>
                    </button>
                </div>

                <div class="mb-3">
                    <input class="btn btn-primary w-100" type="submit" value="ログイン">
                </div>

                <div class="d-flex justify-content-center align-items-center">
                    <span class="me-2 text-muted small">アカウントが未登録ですか？</span>
                    <a href="/register" class="btn btn-link" style="background-color: aliceblue;">新規ユーザ登録はこちら</a>
                </div>
            </form>
        </div>

    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const toggleIcon = toggleButton.querySelector('i');

    toggleButton.addEventListener('click', function() {
        // 現在のtype属性を確認し、'password'と'text'を切り替える
        const currentType = passwordInput.getAttribute('type');
        const newType = currentType === 'password' ? 'text' : 'password';

        // type属性を切り替える
        passwordInput.setAttribute('type', newType);

        // アイコンを切り替える (Bootstrap Iconsのクラス)
        if (newType === 'text') {
            toggleIcon.classList.remove('bi-eye-slash-fill');
            toggleIcon.classList.add('bi-eye-fill');
        } else {
            toggleIcon.classList.remove('bi-eye-fill');
            toggleIcon.classList.add('bi-eye-slash-fill');
        }
    });
});
</script>
{% endblock content %}
